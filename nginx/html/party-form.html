<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>파티 만들기 · 같이 타요</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header>
    <a href="index.html" class="logo">같이 타요</a>
    <nav>
      <span id="who" class="who"></span>
      <button id="logout" class="nav-link" type="button">로그아웃</button>
    </nav>
  </header>

  <main class="narrow">
    <a id="back" href="index.html" class="back">← 목록으로</a>
    <section class="card">
      <h1 id="title">파티 만들기</h1>
      <p class="hint" id="hint">만든 사람이 방장이 되고, 최대 4명까지 함께 탈 수 있어요.</p>
      <form id="party-form">
        <label>만나는 장소 <input id="meet_place" required maxlength="50" placeholder="예: 정문, 기숙사 앞"></label>
        <label>목적지 <input id="destination" required maxlength="50" placeholder="예: 양주역"></label>
        <!-- Safari는 datetime-local에서 시간 선택 목록을 안 보여줘서 날짜 + 시/분 드롭다운으로 나눔 -->
        <label>출발 날짜 <input id="depart_date" type="date" required></label>
        <div class="time-row">
          <label>시 <select id="depart_hour" required></select></label>
          <label>분 <select id="depart_min" required></select></label>
        </div>
        <button type="submit" class="full" id="submit">파티 만들기</button>
      </form>
      <p id="message" class="message"></p>
    </section>
  </main>

  <script src="app.js?v=2"></script>
  <script>
    const partyId = new URLSearchParams(location.search).get('id');   // 있으면 수정 모드
    const message = document.getElementById('message');
    const field = (id) => document.getElementById(id);
    let original = null;

    // 수정 모드면 기존 내용을 불러오기 전까지 저장 버튼을 막음 (입력한 값이 덮어써지는 것 방지)
    if (partyId) field('submit').disabled = true;
    const pad = (n) => String(n).padStart(2, '0');
    for (let h = 0; h < 24; h++) field('depart_hour').add(new Option(`${pad(h)}시`, pad(h)));
    for (let m = 0; m < 60; m += 5) field('depart_min').add(new Option(`${pad(m)}분`, pad(m)));
    field('depart_date').min = kstInputValue(0).slice(0, 10);
    field('depart_date').max = kstInputValue(7 * 24 * 60).slice(0, 10);

    // 'YYYY-MM-DDTHH:MM' ↔ 날짜 칸 + 시/분 드롭다운
    function getDepart() {
      return `${field('depart_date').value}T${field('depart_hour').value}:${field('depart_min').value}`;
    }
    function setDepart(value) {
      const [date, time] = value.split('T');
      const [h, m] = time.split(':');
      field('depart_date').value = date;
      field('depart_hour').value = h;
      // 5분 단위가 아닌 기존 시간(예: 18:07)은 목록에 추가해서 그대로 보여줌
      if (![...field('depart_min').options].some((o) => o.value === m)) {
        field('depart_min').add(new Option(`${m}분`, m));
      }
      field('depart_min').value = m;
    }

    async function init() {
      await requireLogin();
      if (!partyId) {
        // 기본값: 30분 뒤를 5분 단위로 올림
        const d = new Date(Date.now() + 9 * 3600000 + 30 * 60000);
        d.setUTCMinutes(Math.ceil(d.getUTCMinutes() / 5) * 5, 0, 0);
        setDepart(d.toISOString().slice(0, 16));
        return;
      }
      document.title = '파티 수정 · 같이 타요';
      field('title').textContent = '파티 수정';
      field('hint').textContent = '바뀐 내용은 채팅방에 자동으로 안내됩니다.';
      field('submit').textContent = '수정하기';
      field('back').href = `party.html?id=${partyId}`;
      field('back').textContent = '← 채팅방으로';
      try {
        const { party } = await api(`/api/parties/${partyId}`);
        if (!party.is_host) throw new Error('방장만 수정할 수 있습니다.');
        original = party;
        field('meet_place').value = party.meet_place;
        field('destination').value = party.destination;
        setDepart(party.depart_at.replace(' ', 'T'));
        field('submit').disabled = false;
      } catch (e) {
        showMessage(message, e.message, 'fail');
        field('party-form').hidden = true;
      }
    }

    field('party-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const body = {
        meet_place: field('meet_place').value.trim(),
        destination: field('destination').value.trim(),
        depart_at: getDepart(),
      };
      try {
        if (partyId) {
          // 바뀐 항목만 보냄
          const changes = {};
          for (const key of Object.keys(body)) {
            const before = key === 'depart_at' ? original.depart_at.replace(' ', 'T') : original[key];
            if (body[key] !== before) changes[key] = body[key];
          }
          if (Object.keys(changes).length) {
            await api(`/api/parties/${partyId}`, { method: 'PATCH', body: JSON.stringify(changes) });
          }
          location.href = `party.html?id=${partyId}`;
        } else {
          const party = await api('/api/parties', { method: 'POST', body: JSON.stringify(body) });
          location.href = `party.html?id=${party.id}`;
        }
      } catch (e) {
        showMessage(message, e.message, 'fail');
      }
    });

    init();
  </script>
</body>
</html>
