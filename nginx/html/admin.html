<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="admin">
    <a href="admin.html" class="logo">학과 공지 <span class="mode">관리자</span></a>
    <nav>
      <a href="index.html" class="nav-link">일반 화면</a>
      <button id="logout" class="link-button">로그아웃</button>
    </nav>
  </header>

  <main>
    <h1>관리자</h1>

    <section class="card">
      <h2>글 작성</h2>
      <form id="notice-form">
        <div class="segmented" role="radiogroup" aria-label="글 종류">
          <label><input type="radio" name="category" value="notice" checked><span>공지</span></label>
          <label><input type="radio" name="category" value="recruit"><span>모집글</span></label>
        </div>
        <label>제목 <input id="title" maxlength="100" required></label>
        <label>내용 <textarea id="content" rows="5" maxlength="5000" required></textarea></label>
        <label id="capacity-field" hidden>모집 정원 <input id="capacity" type="number" min="1" max="10000"></label>
        <button type="submit" id="submit-button">공지 등록</button>
      </form>
      <p id="create-message" class="message"></p>
    </section>

    <section class="card">
      <h2>모집글 신청자 명단</h2>
      <div class="inline-form">
        <select id="notice-select"></select>
        <button id="load-applicants" class="secondary">조회</button>
      </div>
      <p id="list-message" class="message"></p>
      <table id="applicant-table" hidden>
        <thead><tr><th>#</th><th>학번</th><th>이름</th><th>신청 시각</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    // 로그인 안 한 상태로 들어오면 로그인 화면으로
    if (!getAdminPassword()) location.replace('login.html');

    const form = document.getElementById('notice-form');
    const capacityField = document.getElementById('capacity-field');
    const capacityInput = document.getElementById('capacity');
    const submitButton = document.getElementById('submit-button');
    const createMessage = document.getElementById('create-message');
    const listMessage = document.getElementById('list-message');
    const select = document.getElementById('notice-select');
    const table = document.getElementById('applicant-table');

    const selectedCategory = () => form.querySelector('input[name="category"]:checked').value;

    // 관리자 API 호출: 비밀번호를 헤더에 붙이고, 401이면 로그인 화면으로 보냄
    async function adminApi(path, options = {}) {
      try {
        return await api(path, {
          ...options,
          headers: { 'X-Admin-Password': getAdminPassword(), ...(options.headers || {}) },
        });
      } catch (e) {
        if (e.status === 401) {
          clearAdminPassword();
          location.replace('login.html');
        }
        throw e;
      }
    }

    // 종류에 따라 정원 칸과 버튼 문구 전환
    function updateFormForCategory() {
      const isRecruit = selectedCategory() === 'recruit';
      capacityField.hidden = !isRecruit;
      capacityInput.required = isRecruit;
      submitButton.textContent = isRecruit ? '모집글 등록' : '공지 등록';
    }
    form.querySelectorAll('input[name="category"]').forEach(r => r.addEventListener('change', updateFormForCategory));

    document.getElementById('logout').addEventListener('click', () => {
      clearAdminPassword();
      location.href = 'index.html';
    });

    async function loadRecruitOptions() {
      try {
        const { notices } = await api('/api/notices?category=recruit');
        select.innerHTML = notices.length
          ? notices.map(n => `<option value="${n.id}">#${n.id} ${escapeHtml(n.title)} (${n.applied}/${n.capacity})</option>`).join('')
          : '<option value="">모집글 없음</option>';
      } catch (e) {
        showMessage(listMessage, e.message, 'fail');
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const category = selectedCategory();
      const body = {
        category,
        title: document.getElementById('title').value,
        content: document.getElementById('content').value,
      };
      if (category === 'recruit') body.capacity = Number(capacityInput.value);

      try {
        const result = await adminApi('/api/notices', { method: 'POST', body: JSON.stringify(body) });
        const label = category === 'recruit' ? '모집글' : '공지';
        showMessage(createMessage, `${label} #${result.id}가 등록되었습니다.`, 'ok');
        form.reset();
        updateFormForCategory();
        loadRecruitOptions();
      } catch (e) {
        showMessage(createMessage, e.message, 'fail');
      }
    });

    document.getElementById('load-applicants').addEventListener('click', async () => {
      table.hidden = true;
      if (!select.value) return showMessage(listMessage, '조회할 모집글이 없습니다.', 'fail');
      try {
        const { notice, applications } = await adminApi(`/api/notices/${select.value}/applications`);
        showMessage(listMessage, `${notice.title} — 신청 ${notice.applied} / 정원 ${notice.capacity}`, 'ok');
        if (applications.length === 0) {
          listMessage.textContent += ' (신청자 없음)';
          return;
        }
        table.querySelector('tbody').innerHTML = applications.map((a, i) => `
          <tr><td>${i + 1}</td><td>${escapeHtml(a.student_id)}</td><td>${escapeHtml(a.name)}</td><td>${escapeHtml(a.created_at)}</td></tr>`).join('');
        table.hidden = false;
      } catch (e) {
        showMessage(listMessage, e.message, 'fail');
      }
    });

    updateFormForCategory();
    loadRecruitOptions();
  </script>
</body>
</html>
