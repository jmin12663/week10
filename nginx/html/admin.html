<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="admin">
    <a href="admin.html" class="logo">학과 공지 <span class="mode">관리자</span></a>
    <nav>
      <a href="index.html" class="nav-link">일반 화면</a>
      <button id="logout" class="link-button">로그아웃</button>
    </nav>
  </header>

  <main>
    <h1>관리자</h1>

    <!-- 작성 / 수정 겸용 폼 -->
    <section class="card" id="form-card">
      <h2 id="form-title">글 작성</h2>
      <form id="notice-form">
        <div class="segmented" role="radiogroup" aria-label="글 종류">
          <label><input type="radio" name="category" value="notice" checked><span>공지</span></label>
          <label><input type="radio" name="category" value="recruit"><span>모집글</span></label>
        </div>
        <label>제목 <input id="title" maxlength="100" required></label>
        <label>내용 <textarea id="content" rows="5" maxlength="5000" required></textarea></label>
        <label id="capacity-field" hidden>모집 정원 <input id="capacity" type="number" min="1" max="10000"></label>
        <div class="form-actions">
          <button type="submit" id="submit-button">공지 등록</button>
          <button type="button" id="cancel-edit" class="secondary" hidden>취소</button>
        </div>
      </form>
      <p id="form-message" class="message"></p>
    </section>

    <!-- 작성된 글 목록 -->
    <section class="card">
      <div class="title-row">
        <h2>작성된 글</h2>
        <button id="refresh" class="secondary small">새로고침</button>
      </div>
      <p id="list-message" class="message"></p>
      <ul id="post-list" class="admin-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    // 로그인 안 한 상태로 들어오면 로그인 화면으로
    if (!getAdminPassword()) location.replace('login.html');

    const form = document.getElementById('notice-form');
    const formCard = document.getElementById('form-card');
    const formTitle = document.getElementById('form-title');
    const radios = form.querySelectorAll('input[name="category"]');
    const titleInput = document.getElementById('title');
    const contentInput = document.getElementById('content');
    const capacityField = document.getElementById('capacity-field');
    const capacityInput = document.getElementById('capacity');
    const submitButton = document.getElementById('submit-button');
    const cancelButton = document.getElementById('cancel-edit');
    const formMessage = document.getElementById('form-message');
    const listMessage = document.getElementById('list-message');
    const postList = document.getElementById('post-list');

    let editingId = null;   // null이면 작성 모드, 숫자면 그 글을 수정 중
    let posts = [];

    const selectedCategory = () => form.querySelector('input[name="category"]:checked').value;
    const label = (category) => category === 'recruit' ? '모집글' : '공지';

    // 관리자 API 호출: 비밀번호를 헤더에 붙이고, 401이면 로그인 화면으로 보냄
    async function adminApi(path, options = {}) {
      try {
        return await api(path, {
          ...options,
          headers: { 'X-Admin-Password': getAdminPassword(), ...(options.headers || {}) },
        });
      } catch (e) {
        if (e.status === 401) {
          clearAdminPassword();
          location.replace('login.html');
        }
        throw e;
      }
    }

    document.getElementById('logout').addEventListener('click', () => {
      clearAdminPassword();
      location.href = 'index.html';
    });

    /* ── 작성 / 수정 폼 ─────────────────────────── */

    // 종류에 따라 정원 칸과 버튼 문구 전환
    function updateForm() {
      const isRecruit = selectedCategory() === 'recruit';
      capacityField.hidden = !isRecruit;
      capacityInput.required = isRecruit;
      submitButton.textContent = editingId ? '수정 저장' : `${label(selectedCategory())} 등록`;
    }
    radios.forEach(r => r.addEventListener('change', updateForm));

    function resetForm() {
      editingId = null;
      form.reset();
      radios.forEach(r => (r.disabled = false));
      formTitle.textContent = '글 작성';
      cancelButton.hidden = true;
      formCard.classList.remove('editing');
      updateForm();
    }
    cancelButton.addEventListener('click', () => {
      resetForm();
      formMessage.className = 'message';
    });

    async function startEdit(id) {
      try {
        const post = await api(`/api/notices/${id}`);   // 목록에는 본문이 없어서 상세를 불러옴
        editingId = id;
        form.querySelector(`input[value="${post.category}"]`).checked = true;
        radios.forEach(r => (r.disabled = true));        // 종류는 수정 불가
        titleInput.value = post.title;
        contentInput.value = post.content;
        capacityInput.value = post.capacity ?? '';
        formTitle.textContent = `${label(post.category)} 수정 #${id}`;
        cancelButton.hidden = false;
        formCard.classList.add('editing');
        formMessage.className = 'message';
        updateForm();
        formCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
        titleInput.focus({ preventScroll: true });
      } catch (e) {
        showMessage(listMessage, e.message, 'fail');
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const category = selectedCategory();
      const body = { title: titleInput.value, content: contentInput.value };
      if (category === 'recruit') body.capacity = Number(capacityInput.value);

      try {
        if (editingId) {
          await adminApi(`/api/notices/${editingId}`, { method: 'PUT', body: JSON.stringify(body) });
          showMessage(formMessage, `#${editingId} 글이 수정되었습니다.`, 'ok');
        } else {
          body.category = category;
          const result = await adminApi('/api/notices', { method: 'POST', body: JSON.stringify(body) });
          showMessage(formMessage, `${label(category)} #${result.id}가 등록되었습니다.`, 'ok');
        }
        resetForm();
        loadPosts();
      } catch (e) {
        showMessage(formMessage, e.message, 'fail');
      }
    });

    /* ── 작성된 글 목록 ─────────────────────────── */

    async function loadPosts() {
      try {
        ({ notices: posts } = await api('/api/notices'));
        if (posts.length === 0) {
          postList.innerHTML = '<li class="empty">작성된 글이 없습니다.</li>';
          return;
        }
        postList.innerHTML = posts.map(p => `
          <li data-id="${p.id}">
            <div class="row">
              <div class="row-info">
                <a href="notice.html?id=${p.id}" class="row-title">${categoryChip(p.category)} ${escapeHtml(p.title)}</a>
                <span class="notice-meta">#${p.id} · ${escapeHtml(p.created_at)}${
                  p.category === 'recruit' ? ` · 신청 ${p.applied} / ${p.capacity}` : ''}</span>
              </div>
              <div class="actions">
                ${p.category === 'recruit' ? '<button class="secondary small" data-action="applicants">명단</button>' : ''}
                <button class="secondary small" data-action="edit">수정</button>
                <button class="danger small" data-action="delete">삭제</button>
              </div>
            </div>
            <div class="applicants" hidden></div>
          </li>`).join('');
        listMessage.className = 'message';
      } catch (e) {
        showMessage(listMessage, e.message, 'fail');
      }
    }

    async function toggleApplicants(li, id) {
      const box = li.querySelector('.applicants');
      if (!box.hidden) { box.hidden = true; return; }
      try {
        const { applications } = await adminApi(`/api/notices/${id}/applications`);
        box.innerHTML = applications.length === 0
          ? '<p class="notice-meta">아직 신청자가 없습니다.</p>'
          : `<table>
               <thead><tr><th>순번</th><th>학번</th><th>이름</th><th>신청 시각</th></tr></thead>
               <tbody>${applications.map((a, i) => `
                 <tr><td>${i + 1}</td><td>${escapeHtml(a.student_id)}</td><td>${escapeHtml(a.name)}</td><td>${escapeHtml(a.created_at)}</td></tr>`).join('')}
               </tbody>
             </table>`;
        box.hidden = false;
      } catch (e) {
        showMessage(listMessage, e.message, 'fail');
      }
    }

    async function deletePost(id) {
      const post = posts.find(p => p.id === id);
      const extra = post.category === 'recruit' && post.applied > 0
        ? `\n신청 내역 ${post.applied}건도 함께 삭제됩니다.` : '';
      if (!confirm(`"${post.title}" 글을 삭제할까요?${extra}`)) return;
      try {
        await adminApi(`/api/notices/${id}`, { method: 'DELETE' });
        if (editingId === id) resetForm();
        showMessage(listMessage, `#${id} 글이 삭제되었습니다.`, 'ok');
        loadPosts();
      } catch (e) {
        showMessage(listMessage, e.message, 'fail');
      }
    }

    // 목록의 버튼 클릭을 한 곳에서 처리
    postList.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      const li = button.closest('li');
      const id = Number(li.dataset.id);
      if (button.dataset.action === 'edit') startEdit(id);
      if (button.dataset.action === 'delete') deletePost(id);
      if (button.dataset.action === 'applicants') toggleApplicants(li, id);
    });

    document.getElementById('refresh').addEventListener('click', loadPosts);

    resetForm();
    loadPosts();
  </script>
</body>
</html>
