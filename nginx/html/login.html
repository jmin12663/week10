<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 로그인</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">학과 공지</a>
    <a href="login.html" class="nav-link">관리자</a>
  </header>

  <main class="narrow">
    <section class="card login-card">
      <h1>관리자 로그인</h1>
      <p class="hint">공지 작성과 신청자 명단은 관리자만 이용할 수 있습니다.</p>
      <form id="login-form">
        <label>비밀번호 <input id="password" type="password" autocomplete="current-password" required autofocus></label>
        <button type="submit" class="full">입장</button>
      </form>
      <p id="message" class="message"></p>
      <a href="index.html" class="back">← 일반 화면으로</a>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    // 이미 로그인한 상태면 바로 관리자 페이지로
    if (getAdminPassword()) location.replace('admin.html');

    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = document.getElementById('message');
      const password = document.getElementById('password').value;
      try {
        await api('/api/admin/login', { method: 'POST', body: JSON.stringify({ password }) });
        setAdminPassword(password);
        location.href = 'admin.html';
      } catch (e) {
        showMessage(message, e.message, 'fail');
      }
    });
  </script>
</body>
</html>
