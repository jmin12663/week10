<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학과 공지 · 선착순 모집</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">학과 공지</a>
    <a href="login.html" class="nav-link">관리자</a>
  </header>

  <main>
    <div class="title-row">
      <h1>게시판</h1>
      <button id="refresh" class="secondary">새로고침</button>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab active" data-category="">전체</button>
      <button class="tab" data-category="notice">공지</button>
      <button class="tab" data-category="recruit">모집</button>
    </div>

    <ul id="notice-list" class="notice-list"></ul>
    <p id="message" class="message"></p>
  </main>

  <script src="app.js"></script>
  <script>
    const list = document.getElementById('notice-list');
    const message = document.getElementById('message');
    const tabs = document.querySelectorAll('.tab');

    // 주소의 ?category= 값으로 시작 탭 결정 (새로고침해도 탭 유지)
    let category = new URLSearchParams(location.search).get('category') || '';

    function renderTabs() {
      tabs.forEach(t => t.classList.toggle('active', t.dataset.category === category));
    }

    async function loadNotices() {
      try {
        const query = category ? `?category=${category}` : '';
        const { notices } = await api(`/api/notices${query}`);
        if (notices.length === 0) {
          list.innerHTML = '<li class="empty">등록된 글이 없습니다.</li>';
          return;
        }
        list.innerHTML = notices.map(n => `
          <li>
            <a href="notice.html?id=${n.id}" class="${n.category}">
              <span class="notice-title">${categoryChip(n.category)} ${escapeHtml(n.title)}</span>
              <span class="notice-meta">${escapeHtml(n.created_at)}</span>
              ${seatBadge(n.remaining, n.capacity)}
            </a>
          </li>`).join('');
        message.className = 'message';
      } catch (e) {
        showMessage(message, e.message, 'fail');
      }
    }

    tabs.forEach(tab => tab.addEventListener('click', () => {
      category = tab.dataset.category;
      history.replaceState(null, '', category ? `?category=${category}` : 'index.html');
      renderTabs();
      loadNotices();
    }));
    document.getElementById('refresh').addEventListener('click', loadNotices);

    renderTabs();
    loadNotices();
  </script>
</body>
</html>
